[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

lib_deps =
    ; The TM1637TinyDisplay6 library was merged into TM1637TinyDisplay (contains both headers).
    ; Pulling straight from GitHub, pinned to a known-good tag.
    https://github.com/jasonacox/TM1637TinyDisplay.git#v1.12.2
    bblanchon/ArduinoJson@^6.21.5

monitor_speed = 115200
